      <h1>Larx</h1>
      <p class="where">Co-founded, raised $2.5 million, and went live in March 2025.</p>
      <p class="tags"><a href="../#journal/larx">larx</a> · <a href="../#journal/company">company</a></p>
      <div id="essay-body"></div>
      <textarea id="essay-source" hidden>Co-founded [Larx](https://larx.io). The company raised $2.5 million. Larx went live in March 2025.

Larx is an intelligence platform for the agentic age. An agent is a program that takes a step toward a goal. Larx fuses visual, sensor, and multi-domain data into decision intelligence for defense and operational environments. To fuse means to join those separate streams into one picture. Multi-domain means the streams are different kinds of input: pictures, sensors, and others. Decision intelligence means that picture is shaped into a decision.
</textarea>
