      <h1>On dying</h1>
      <p class="where">I've died a thousand times</p>
      <p class="tags"><a href="../#journal/philosophy">philosophy</a> · <a href="../#journal/dying">dying</a></p>
      <div id="essay-body"></div>
      <textarea id="essay-source" hidden>"Cowards die many times before their deaths" - William Shakespeare

I've thought about dying for as long as I can remember. In fact, it comforts me. I think most of us spend our lives avoiding the thought. But that always seemed undignified, even craven, as if we're all just prey hiding in the forest, jumping at every shadow.

It seems cowardly to avoid something so central to our experience. Before I came so close with death I swore to live with more than dignity alone, but with a zealous appreciation for existence. Taking every advantage. But now I feel Dante's panther, wild and hostile, stalking me in the dark. I cannot see it in the shadowed, oppressive forest, but it sees me. I can't see down into the abyss, but it sees me. The depthless black and inscrutable eye of a white shark. The crushing magnitude of the universe.

If I turn away from it, it will sneak up on me. I've seen so many people, alive for one glorious time under the sun, die having never seen it stalking them. As a soldier, the only thing I liked less than dying was to die without warning.

I have things to say to people I'll summon in my mind, before then. I want a chance to tell someone where I'll be, if we find ourselves across the river again.

To ignore means letting it creep closer. To dwell on it means missing all the glory of existence. Confronting it frees me from constraints. It saves my soul, captured here, today, in this body, under this star, for my brief chance.</textarea>
    </article>
