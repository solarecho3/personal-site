# Matrix Applications

## Multivariate Data Covariance Matrices
Covariance is interpreted the same as correlation: when variables move together it is positive, negative when they move apart, and 0 if there is no linear relationship. That's because covariance is the dot product between two mean-centered variables. It's the numerator of the [Pearson correlation coefficient](vectors.html#pearson-correlation-coefficient):

$$c_{a,b} = (n-1)^{-1}\sum^n_{i=1}(x_i - \bar{x})(y_i - \bar{y})$$

$x^{-1}=\frac{1}{x}$. And, as in the Pearson correlation coefficient, if $\mathbf{\widetilde{x}}$ is the mean-centered variable $\mathbf{x}$, and $$\mathbf{\widetilde{x}}^\text{T}\mathbf{\widetilde{y}}\frac{1}{n-1}$$ then covariance is simply $$\frac{\mathbf{\widetilde{x}}^\text{T}\mathbf{\widetilde{y}}}{n-1}$$
Covariance has a normalization factor of $n-1$, where n is the number of data points. Normalization prevents the covariance from growing larger as you sum more data values together. It's analogous to dividing by $N$ to transform a sum into an average.

The centering step, worked by hand, is in [Vectors](vectors.html#by-hand-mean-centering).

## Geometric Transformations via Matrix-Vector Multiplication

Pure rotation matrices are used to rotate a vector while preserving its length. A 2D rotation matrix can be expressed as: 
$$
\mathbf{T}=
\begin{bmatrix}
\cos(\theta) &amp; \sin(\theta) \\
-\sin(\theta) &amp; \cos(\theta)
\end{bmatrix}
$$

A pure rotation matrix is orthogonal. The columns of $\mathbf{T}$ are orthogonal because their dot product is $\cos(\theta)\sin(\theta)-\sin(\theta)\cos(\theta)$, and are unit vectors because of the Pythagorean trigonometric identity that $\cos^2(\theta)+sin^2(\theta)=1$.

## Image Feature Detection with Convolution
First we design a 2D gaussian kernel. The equation is:
$$G=exp(-(X^2+Y^2)/\sigma)$$

This is the same as:

$$G=e^{(-(X^2+Y^2)/\sigma)}$$

Where $X$ and $Y$ are 2D grids of (x,y) coordinates on which to evaluate the function, $\sigma$ is a parameter of the function called the "shape" or "width": smaller values make the Gaussian narrower, while larger values make it wider.

$X^2+Y^2$ is the squared straight-line distance from the middle of the grid. It is the Pythagorean sum of one horizontal step and one vertical step. The exponential of the negative of that distance is tall at the center and falls toward the corners.

normalize the kernel sum to 1

during matmul it preserves the data scale

Gaussian parameters

```python
def gaussian(size=21, sigma=5):
    xs = np.linspace(-3,3,size)
    X,Y = np.meshgrid(xs,xs)
    kernel = np.exp(-(X**2+Y**2)/sigma)

    # normalize the kernel sum to 1
    # during matmul it preserves the data scale
    kernel = kernel / np.sum(kernel)
    return kernel
```

The convolution process is the same as used in [Signal smoothing with a kernel and dot product](vectors.html#signal-smoothing-with-a-kernel-and-dot-product); Hadamard multiply and then sum to retrieve the dot products. The only difference is that it is done on two dimensions instead of one.

In one dimension the sum, with the kernel flipped as it slides, is

$$(f*g)[n]=\sum_k f[k]\,g[n-k]$$

The index $n-k$ runs the kernel backwards while $n$ says where the window sits. In two dimensions the same sum runs over rows and over columns. The Gaussian kernel above is one such window.

## The Matrix Equation Ax=b

If $\mathbf{A}$ is an $m\times n$ matrix, with columns $\mathbf{a}_1,\dots,\mathbf{a}_n$, and if $\mathbf{x}$ is in $\mathbb{R}^n$, then the product of $\mathbf{A}$ and $\mathbf{x}$ is denoted by $\mathbf{Ax}$, is the linear combination of the columns of $\mathbf{A}$ using the corresponding entries in $\mathbf{x}$ as weights:
$$
\mathbf{Ax}=
\begin{bmatrix}\mathbf{a}_1&amp;\mathbf{a}_2&amp;\dots&amp;\mathbf{a}_n \end{bmatrix}
\begin{bmatrix}
x_1\\x_2\\\vdots\\x_n
\end{bmatrix}
= x_1\mathbf{a}_1 + x_2\mathbf{a}_2+\dots+x_n\mathbf{a}_n
$$
and can only be valid if the number of columns in $\mathbf{A}$ equals the number of entries in $\mathbf{x}$.

## Matrix Inversion
The inverse of matrix $\mathbf{A}$ is matrix $\mathbf{A}^{-1}$ ("A inverse").

We use it to solve $\mathbf{Ax}=\mathbf{b}$ when $\mathbf{A}$ and $\mathbf{b}$ are known and we want to solve for $\mathbf{x}$. The solution is generally:

$$
\begin{align}
\mathbf{Ax}&amp;=\mathbf{b} \\
\mathbf{A^{-1}Ax}&amp;=\mathbf{A^{-1}b} \\
\mathbf{Ix}&amp;=\mathbf{A^{-1}b}\\
\mathbf{x}&amp;=\mathbf{A^{-1}b}
\end{align}
$$

Types of Inverses

### Full Inverse
Only square, full-rank matrices can have a full inverse. This means that, for square, full-rank matrices $\mathbf{A^{-1}A}=\mathbf{AA^{-1}}=\mathbf{I}$.

### One-sided Inverse
A tall matrix $\mathbf{T}$ can have a *left-inverse*: $\mathbf{LT}=\mathbf{I}$ but $\mathbf{TL}\ne\mathbf{I}$, and if it is full rank-*N* (full column rank).

A wide matrix $\mathbf{W}$ can have a *right-inverse*: $\mathbf{WR}=\mathbf{I}$ but $\mathbf{RW}\ne\mathbf{I}$, and if it is full rank-*M* (full row rank).

### Pseudoinverse
All full-rank matrices have pseudoinverse matrices which are the same as full and one-sided intverted matrices respectively. But reduced-rank matrices have a pseudoinverse matrix which is close, but not equal, to the identity matrix. These are called *singular* or *noninvertible*, which is pseudonymous with *reduced-rank* or *rank-deficient*.

### Computing the Left-Inverse and Application

Producing the identity matrix, the next 4 steps, follow the equation:
$$(\mathbf{T}^\text{T}\mathbf{T})^{-1}(\mathbf{T}^\text{T}\mathbf{T})=\mathbf{I}$$
In order to produce the identity matrix for $\mathbf{T}$ we use the inverse of $(\mathbf{T}^{\text{T}}\mathbf{T})$, thus we're not using the inverse of $\mathbf{T}$.

Then we multiply the inverse matrix by the transposed matrix $\mathbf{T}$:
$$\begin{align}
\mathbf{L}&amp;=(\mathbf{T}^{\text{T}}\mathbf{T})^{-1}\mathbf{T}^{\text{T}} \\
\mathbf{LT}&amp;=\mathbf{I}
\end{align}
$$

## Moore-Penrose Pseudoinverse
Reduced-rank matrices cannot be transformed into the identity matrix via matrix multiplication, meaning they have no full or one-sided inverse. But singular matrices do have pseudoinverses. 

Pseudoinverses are transformation matrices that bring a matrix close to the identity matrix. A reduced-rank matrix has an infinite number of pseudoinverses. The Moore-Penrose pseudoinverse, *MP* pseudoinverse, is the most common and the one generally referred to. 

Denoted with dagger, plus, or asterisk in superscript: $\mathbf{A}^\dagger$, $\mathbf{A}^+$, or $\mathbf{A}^*$.

$$
\begin{align}
\begin{bmatrix}
1 &amp; 4\\
2 &amp; 8
\end{bmatrix}
&amp;=\frac{1}{85}
\begin{bmatrix}
1 &amp; 2\\
4 &amp; 8
\end{bmatrix} \\
\begin{bmatrix}
1 &amp; 4\\
2 &amp; 8
\end{bmatrix}
\frac{1}{85}
\begin{bmatrix}
1 &amp; 2\\
4 &amp; 8
\end{bmatrix}
&amp;=
\begin{bmatrix}
.2 &amp; .4\\
.4 &amp; .8
\end{bmatrix}
\end{align}
$$

```python

    [1,4],
    [2,8]
])
A_pinv = np.linalg.pinv(A)
A@A_pinv

       [0.4, 0.8]])
```

To compute the MP pseudoinverse take the singular value decomposition of a matrix, invert the nonzero singular values without changing the singular vectors, and reconstruct the matrix by multiplying $\mathbf{U\Sigma^+V^\text{T}}$.

Singular value decomposition splits a matrix into three factors:

$$\mathbf{A}=\mathbf{U}\boldsymbol{\Sigma}\mathbf{V}^\top$$

The columns of $\mathbf{U}$ and of $\mathbf{V}$ are orthogonal and of length 1, so each of those matrices is a rotation, a turn that keeps lengths. $\boldsymbol{\Sigma}$ is diagonal: entries off the diagonal, where the row number differs from the column number, are zero. The diagonal entries are the singular values, the stretch factors, written $\sigma$. The pseudoinverse keeps the rotations and replaces each nonzero stretch $\sigma$ with $1/\sigma$, and leaves the zeros as zeros. When $\mathbf{A}$ is square and full rank, every stretch is nonzero, and this product is the ordinary inverse.

import numpy as np
import matplotlib.pyplot as plt
from mpl_toolkits.mplot3d import Axes3D

def plot_3d_rotation(axis='z', angle=90):
    fig = plt.figure(figsize=(10, 10))
    ax = fig.add_subplot(111, projection='3d')
    
    # Original basis vectors
    x = np.array([1, 0, 0])  # red
    y = np.array([0, 1, 0])  # green
    z = np.array([0, 0, 1])  # blue
    
    # Create rotation matrix
    theta = np.radians(angle)
    if axis == 'x':
        R = np.array([
            [1, 0, 0],
            [0, np.cos(theta), -np.sin(theta)],
            [0, np.sin(theta), np.cos(theta)]
        ])
    elif axis == 'y':
        R = np.array([
            [np.cos(theta), 0, np.sin(theta)],
            [0, 1, 0],
            [-np.sin(theta), 0, np.cos(theta)]
        ])
    else:  # z-axis
        R = np.array([
            [np.cos(theta), -np.sin(theta), 0],
            [np.sin(theta), np.cos(theta), 0],
            [0, 0, 1]
        ])
    
    # Rotate vectors
    x_rot = R @ x
    y_rot = R @ y
    z_rot = R @ z
    
    # Plot original vectors
    ax.quiver(0, 0, 0, x[0], x[1], x[2], color='r', alpha=0.5, label='Original X')
    ax.quiver(0, 0, 0, y[0], y[1], y[2], color='g', alpha=0.5, label='Original Y')
    ax.quiver(0, 0, 0, z[0], z[1], z[2], color='b', alpha=0.5, label='Original Z')
    
    # Plot rotated vectors
    ax.quiver(0, 0, 0, x_rot[0], x_rot[1], x_rot[2], color='darkred', label='Rotated X')
    ax.quiver(0, 0, 0, y_rot[0], y_rot[1], y_rot[2], color='darkgreen', label='Rotated Y')
    ax.quiver(0, 0, 0, z_rot[0], z_rot[1], z_rot[2], color='darkblue', label='Rotated Z')
    
    # Add axis of rotation
    if axis == 'x':
        ax.plot([-1.5, 1.5], [0, 0], [0, 0], 'k--', label='Rotation Axis (X)')
    elif axis == 'y':
        ax.plot([0, 0], [-1.5, 1.5], [0, 0], 'k--', label='Rotation Axis (Y)')
    else:
        ax.plot([0, 0], [0, 0], [-1.5, 1.5], 'k--', label='Rotation Axis (Z)')
    
    ax.set_xlabel('X')
    ax.set_ylabel('Y')
    ax.set_zlabel('Z')
    ax.set_title(f'Rotation around {axis.upper()}-axis by {angle}°')
    
    # Set consistent scale
    ax.set_xlim([-1.5, 1.5])
    ax.set_ylim([-1.5, 1.5])
    ax.set_zlim([-1.5, 1.5])
    
    plt.legend()
    plt.show()

# Show rotations around each axis
for axis in ['x', 'y', 'z']:
    plot_3d_rotation(axis=axis)

### What is an orthogonal matrix?

Some properties: 

1.  All the columns are pair-wise orthogonal, so their dot products should be 0.
2.  Each column @ itself is 1.
3.  All columns norm (geometric length) to 1.

Written together, for a square matrix, $\mathbf{Q}^\top\mathbf{Q}=\mathbf{I}$, which is why the inverse equals the transpose.

## The Gram-Schmidt procedure to transform a non-orthogonal matrix to an orthogonal one.

Gram-Schmidt builds an orthogonal set one vector at a time. Keep the first vector. From each next vector, subtract its projection onto the ones already kept. That projection is the scalar from [Vectors](vectors.html#orthogonal-vector-projection), $\beta=(\mathbf{a}^\top\mathbf{b})/(\mathbf{a}^\top\mathbf{a})$, times the vector it projects onto. What remains is perpendicular to the ones already kept. Below, a random 3 by 3 matrix is tested, and then $\beta$ is computed for $\mathbf{a}=[2,3]$ and $\mathbf{b}=[2,1]$, the same pair as that projection picture.
