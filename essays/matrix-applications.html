# Matrix Applications

## Multivariate Data Covariance Matrices
Covariance is interpreted the same as correlation: when variables move together it is positive, negative when they move apart, and 0 if there is no linear relationship. That's because covariance is the dot product between two mean-centered variables. It's the numerator of the [Pearson correlation coefficient](vectors.html#pearson-correlation-coefficient):

$$c_{a,b} = (n-1)^{-1}\sum^n_{i=1}(x_i - \bar{x})(y_i - \bar{y})$$

$x^{-1}=\frac{1}{x}$. And, as in the Pearson correlation coefficient, if $\mathbf{\widetilde{x}}$ is the mean-centered variable $\mathbf{x}$, and $$\mathbf{\widetilde{x}}^\text{T}\mathbf{\widetilde{y}}\frac{1}{n-1}$$ then covariance is simply $$\frac{\mathbf{\widetilde{x}}^\text{T}\mathbf{\widetilde{y}}}{n-1}$$
Covariance has a normalization factor of $n-1$, where n is the number of data points. Normalization prevents the covariance from growing larger as you sum more data values together. It's analogous to dividing by $N$ to transform a sum into an average.

## Geometric Transformations via Matrix-Vector Multiplication

Pure rotation matrices are used to rotate a vector while preserving its length. A 2D rotation matrix can be expressed as: 
$$
\mathbf{T}=
\begin{bmatrix}
\cos(\theta) &amp; \sin(\theta) \\
-\sin(\theta) &amp; \cos(\theta)
\end{bmatrix}
$$

A pure rotation matrix is orthogonal. The columns of $\mathbf{T}$ are orthogonal because their dot product is $\cos(\theta)\sin(\theta)-\sin(\theta)\cos(\theta)$, and are unit vectors because of the Pythagorean trigonometric identity that $\cos^2(\theta)+sin^2(\theta)=1$.

To use the transformation matrix $\mathbf{T}$, set $\theta$ to some angle of clockwise rotation, and multiply matrix $\mathbf{T}$ by a 2 x *N* matrix of geometric points, where each column in that matrix contains the (X,Y) coordinates for each of N data points.

$$G=exp(-(X^2+Y^2)/\sigma)$$

This is the same as:

Where $X$ and $Y$ are 2D grids of (x,y) coordinates on which to evaluate the function, $\sigma$ is a parameter of the function called the "shape" or "width": smaller values make the Gaussian narrower, while larger values make it wider.

## The Matrix Equation Ax=b

If $\mathbf{A}$ is an $m\times n$ matrix, with columns $\mathbf{a}_1,\dots,\mathbf{a}_n$, and if $\mathbf{x}$ is in $\mathbb{R}^n$, then the product of $\mathbf{A}$ and $\mathbf{x}$ is denoted by $\mathbf{Ax}$, is the linear combination of the columns of $\mathbf{A}$ using the corresponding entries in $\mathbf{x}$ as weights:
$$
\mathbf{Ax}=
\begin{bmatrix}\mathbf{a}_1&amp;\mathbf{a}_2&amp;\dots&amp;\mathbf{a}_n \end{bmatrix}
\begin{bmatrix}
x_1\\x_2\\\vdots\\x_n
\end{bmatrix}
= x_1\mathbf{a}_1 + x_2\mathbf{a}_2+\dots+x_n\mathbf{a}_n
$$
and can only be valid if the number of columns in $\mathbf{A}$ equals the number of entries in $\mathbf{x}$.

## Matrix Inversion
The inverse of matrix $\mathbf{A}$ is matrix $\mathbf{A}^{-1}$ ("A inverse").

We use it to solve $\mathbf{Ax}=\mathbf{b}$ when $\mathbf{A}$ and $\mathbf{b}$ are known and we want to solve for $\mathbf{x}$. The solution is generally:

$$
\begin{align}
\mathbf{Ax}&amp;=\mathbf{b} \\
\mathbf{A^{-1}Ax}&amp;=\mathbf{A^{-1}b} \\
\mathbf{Ix}&amp;=\mathbf{A^{-1}b}\\
\mathbf{x}&amp;=\mathbf{A^{-1}b}
\end{align}
$$

Types of Inverses

### Full Inverse
Only square, full-rank matrices can have a full inverse. This means that, for square, full-rank matrices $\mathbf{A^{-1}A}=\mathbf{AA^{-1}}=\mathbf{I}$.

### One-sided Inverse
A tall matrix $\mathbf{T}$ can have a *left-inverse*: $\mathbf{LT}=\mathbf{I}$ but $\mathbf{TL}\ne\mathbf{I}$, and if it is full rank-*N* (full column rank).

A wide matrix $\mathbf{W}$ can have a *right-inverse*: $\mathbf{WR}=\mathbf{I}$ but $\mathbf{RW}\ne\mathbf{I}$, and if it is full rank-*M* (full row rank).

### Pseudoinverse
All full-rank matrices have pseudoinverse matrices which are the same as full and one-sided intverted matrices respectively. But reduced-rank matrices have a pseudoinverse matrix which is close, but not equal, to the identity matrix. These are called *singular* or *noninvertible*, which is pseudonymous with *reduced-rank* or *rank-deficient*.

### Computing the Left-Inverse and Application

Producing the identity matrix, the next 4 steps, follow the equation:
$$(\mathbf{T}^\text{T}\mathbf{T})^{-1}(\mathbf{T}^\text{T}\mathbf{T})=\mathbf{I}$$
In order to produce the identity matrix for $\mathbf{T}$ we use the inverse of $(\mathbf{T}^{\text{T}}\mathbf{T})$, thus we're not using the inverse of $\mathbf{T}$.

Then we multiply the inverse matrix by the transposed matrix $\mathbf{T}$:
$$\begin{align}
\mathbf{L}&amp;=(\mathbf{T}^{\text{T}}\mathbf{T})^{-1}\mathbf{T}^{\text{T}} \\
\mathbf{LT}&amp;=\mathbf{I}
\end{align}
$$

## Moore-Penrose Pseudoinverse
Reduced-rank matrices cannot be transformed into the identity matrix via matrix multiplication, meaning they have no full or one-sided inverse. But singular matrices do have pseudoinverses. 

Pseudoinverses are transformation matrices that bring a matrix close to the identity matrix. A reduced-rank matrix has an infinite number of pseudoinverses. The Moore-Penrose pseudoinverse, *MP* pseudoinverse, is the most common and the one generally referred to. 

Denoted with dagger, plus, or asterisk in superscript: $\mathbf{A}^\dagger$, $\mathbf{A}^+$, or $\mathbf{A}^*$.

$$
\begin{align}
\begin{bmatrix}
1 &amp; 4\\
2 &amp; 8
\end{bmatrix}
&amp;=\frac{1}{85}
\begin{bmatrix}
1 &amp; 2\\
4 &amp; 8
\end{bmatrix} \\
\begin{bmatrix}
1 &amp; 4\\
2 &amp; 8
\end{bmatrix}
\frac{1}{85}
\begin{bmatrix}
1 &amp; 2\\
4 &amp; 8
\end{bmatrix}
&amp;=
\begin{bmatrix}
.2 &amp; .4\\
.4 &amp; .8
\end{bmatrix}
\end{align}
$$

```python
A = np.array([
    [1,4],
    [2,8]
])
A_pinv = np.linalg.pinv(A)
A@A_pinv
```

```
array([[0.2, 0.4],
       [0.4, 0.8]])
```

To compute the MP pseudoinverse take the singular value decomposition of a matrix, invert the nonzero singular values without changing the singular vectors, and reconstruct the matrix by multiplying $\mathbf{U\Sigma^+V^\text{T}}$.

### What is an orthogonal matrix?

Some properties: 

1.  All the columns are pair-wise orthogonal, so their dot products should be 0.
2.  Each column @ itself is 1.
3.  All columns norm (geometric length) to 1.

### An identity matrix is an orthogonal matrix.
