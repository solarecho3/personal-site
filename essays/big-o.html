      <p class="tags"><a href="../#journal/math">math</a> · <a href="../#journal/complexity">complexity</a></p>

      <textarea id="essay-source" hidden>Study sequence: [Vectors](vectors.html) · [Matrices](matrices.html) · [Matrix applications](matrix-applications.html) · [Calculus](calculus.html) · Big O · [Geometry](geometry.html) · [Signals](signals.html) · [Neural nets](neural-nets.html) · [Distributions](distributions.html)

## Constant Complexity, $O(1)$

The output rate remains the same.

![Constant Complexity, $O(1)$](../journal/big-o/007-0.png)

## Linear Complexity, $O(n)$

As the input size increases, the output rate increases, at the same rate.

![Linear Complexity, $O(n)$](../journal/big-o/008-0.png)

## Quadratic Complexity, $O(n^2)$

As the input size increases, the output rate increases, at the input rate squared.

![Quadratic Complexity, $O(n^2)$](../journal/big-o/009-0.png)

## Logarithmic Complexity, $O(\log n)$

As the input size increases the output rate decreases at the logarithm of the input.

![Logarithmic Complexity, $O(\log n)$](../journal/big-o/010-0.png)

## Exponential Complexity, $O(2^n)$

![Exponential Complexity, $O(2^n)$](../journal/big-o/011-0.png)
